name: Content issue
description: A lesson, quiz, Trial, cheatsheet, or OSS example is wrong or unclear.
labels: ["type:content", "status:triage"]
body:
  - type: input
    id: content-id
    attributes:
      label: Content ID or URL
      placeholder: learn/ownership/move-semantics or https://rustly.tech/learn/...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Factually incorrect
        - Misleading mental model
        - Example does not compile / wrong output
        - Reference solution fails
        - Broken or moved OSS example link
        - Missing or wrong attribution / license
        - Unclear wording
        - Accessibility problem
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details
      description: Quote the exact text or code and explain what is wrong.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
