# Reusable dependency/security audit for Rustly Rust repositories.
#
# Runs cargo-deny (licenses, bans, advisories, sources) and cargo-audit.
# Scheduled runs are the point: a green build today can become vulnerable
# tomorrow without any commit.
name: rust-security

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: stable
      audit-ignore:
        description: >-
          Space-separated RUSTSEC ids for cargo-audit to ignore. cargo-audit reads
          Cargo.lock, which records every optional dependency whether or not it is
          ever compiled, so an advisory can fire for code the build never touches.
          cargo-deny's advisories check is graph-aware and is not affected, which
          makes it the authority; this input exists only to keep the lockfile scan
          usable. Every id passed here must be justified in the calling workflow.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check ${{ matrix.checks }}

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-audit
      - name: Audit
        run: |
          set -euo pipefail
          args=()
          for id in ${{ inputs.audit-ignore }}; do
            echo "ignoring $id (justified in the calling workflow)"
            args+=(--ignore "$id")
          done
          cargo audit --deny warnings "${args[@]}"
